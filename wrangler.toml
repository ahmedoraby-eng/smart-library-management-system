name = "smart-library"
main = "api/src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# The demo seed is bundled as text (used by the reset job; no file I/O at runtime).
rules = [{ type = "Text", globs = ["**/*.sql"], fallthrough = true }]

[assets]
directory = "web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Nightly demo-data reset: 00:00 UTC = 02:00 Cairo (winter).
# SLM-16: every 15 min, one batch of the discovery index if anything is missing or stale (post-deploy
# backfill, failed inline syncs). Up to date → two cheap queries, no AI call.
[triggers]
crons = ["0 0 * * *", "*/15 * * * *"]

[vars]
ENVIRONMENT = "production"
LOAN_DAYS = "14"
MAX_ACTIVE_LOANS = "5"
DEMO_ACCOUNTS_ENABLED = "true"
AI_MODEL = "@cf/meta/llama-3.2-3b-instruct"
# SLM-16 hybrid retrieval (768-dim, matches migration 0004). "off" = full-text only.
EMBEDDING_MODEL = "@cf/baai/bge-base-en-v1.5"
EMBEDDING_MIN_SIMILARITY = "0.72"
# SLM-16 cost controls (UTC day): global Neurons (free allowance 10,000) and AI searches per staff user.
AI_DAILY_NEURON_CAP = "8000"
AI_USER_DAILY_SEARCHES = "50"
# Set per deployment (public, not secret): GOOGLE_CLIENT_ID, BOOTSTRAP_ADMIN_EMAILS, DEMO_LIBRARIAN_EMAIL, DEMO_ADMIN_EMAIL
# Secrets (wrangler secret put): SESSION_SECRET, GOOGLE_CLIENT_SECRET, DEMO_LIBRARIAN_PASSWORD, DEMO_ADMIN_PASSWORD

# Rate limits shared across isolates and locations (Workers Rate Limiting binding).
# Without a binding (tests, some local runs) the app falls back to a per-isolate in-memory limiter.
[[ratelimits]]
name = "DEMO_LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "HEALTH_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "DISCOVERY_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "GOOGLE_START_LIMITER"
namespace_id = "1004"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "GOOGLE_CALLBACK_LIMITER"
namespace_id = "1005"
simple = { limit = 10, period = 60 }

# SLM-16: the discovery reindex can spend Neurons; Admin only, 2 per minute.
[[ratelimits]]
name = "REINDEX_LIMITER"
namespace_id = "1006"
simple = { limit = 2, period = 60 }

# Postgres (Neon) through Hyperdrive, query cache OFF. Basel fills in the id.

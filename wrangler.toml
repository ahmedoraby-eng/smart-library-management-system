name = "smart-library"
main = "api/src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# The demo seed is bundled as text (used by the reset job; no file I/O at runtime).
rules = [{ type = "Text", globs = ["**/*.sql"], fallthrough = true }]

[assets]
directory = "web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Nightly demo-data reset: 00:00 UTC = 02:00 Cairo (winter).
[triggers]
crons = ["0 0 * * *"]

[vars]
ENVIRONMENT = "production"
LOAN_DAYS = "14"
MAX_ACTIVE_LOANS = "5"
DEMO_ACCOUNTS_ENABLED = "true"
AI_MODEL = "@cf/meta/llama-3.2-3b-instruct"
# Set per deployment (public, not secret): GOOGLE_CLIENT_ID, BOOTSTRAP_ADMIN_EMAILS, DEMO_LIBRARIAN_EMAIL, DEMO_ADMIN_EMAIL
# Secrets (wrangler secret put): SESSION_SECRET, GOOGLE_CLIENT_SECRET, DEMO_LIBRARIAN_PASSWORD, DEMO_ADMIN_PASSWORD

# Postgres (Neon) through Hyperdrive, query cache OFF. Basel fills in the id.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-config-id>"

# [ai]
# binding = "AI"

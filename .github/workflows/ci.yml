name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No employer or client names in the repo
        run: |
          if git grep -n -i -E 'basita|elbayoumy|dairy farm' -- . ':!.github/workflows/ci.yml'; then
            echo "Forbidden name found"; exit 1
          fi

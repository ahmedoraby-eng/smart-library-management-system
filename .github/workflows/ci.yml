name: ci

# Quality gates (SLM-11, 25/11/2026), from the engineering playbook's shared Node CI:
# clean install; typecheck, dependency rules, lint, format and build (`npm run check`); tests with the
# 90% coverage gate (`npm run test:coverage`: API tests on a PostgreSQL 16 + pgvector container, then the web tests);
# and an audit of production dependencies. GitHub-hosted runners: this repository is public.
# The hygiene job (secret scan and forbidden names) stays here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No employer or client names in the repo
        run: |
          if git grep -n -i -E 'basita|elbayoumy|dairy farm' -- . ':!.github/workflows/ci.yml'; then
            echo "Forbidden name found"; exit 1
          fi

  ci:
    uses: ahmedoraby-eng/engineering-playbook/.github/workflows/reusable-node-ci.yml@main
    with:
      runner: '"ubuntu-latest"'
      node-version: "22"
      build-command: npm run check
      test-command: npm run test:coverage
      audit-in-build-job: true
      timeout-minutes: 20

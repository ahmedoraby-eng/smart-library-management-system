<!doctype html>
<html lang="en" data-theme="reading-room">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Library</title>
    <!-- Theme before first paint (no flash). Same key and values as src/lib/theme.ts. -->
    <script>
      try {
        if (localStorage.getItem("slm-theme") === "plain") document.documentElement.dataset.theme = "plain";
      } catch (e) {}
    </script>
    <!-- Opening screen, painted before the app's script arrives. src/lib/splash.ts drives the bar and fades it out
         once the app is ready (at least ~1.8 s the first time in a session, ~0.9 s on a reload). -->
    <style>
      #slm-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(120% 85% at 50% 40%, #21493a 0%, #17352a 45%, #0e231b 100%);
        color: #e9e1d0;
        font-family: "Newsreader Variable", Georgia, serif;
        transition:
          opacity 0.5s ease,
          filter 0.5s ease,
          transform 0.5s ease;
      }
      /* Faint ledger rules, fading out towards the edges. */
      #slm-splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgb(233 225 208 / 0.05) 1px, transparent 1px);
        background-size: 100% 28px;
        mask-image: radial-gradient(55% 45% at 50% 45%, #000, transparent);
        -webkit-mask-image: radial-gradient(55% 45% at 50% 45%, #000, transparent);
        animation: slm-sp-fade 1.2s ease both;
      }
      #slm-splash.out {
        opacity: 0;
        filter: blur(6px);
        transform: scale(1.03);
        pointer-events: none;
      }
      #slm-splash .sp-in {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #slm-splash .sp-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        border: 2px solid rgb(227 204 152 / 0.85);
        border-radius: 3px;
        background: #17352a;
        color: #e3cc98;
        font-size: 44px;
        line-height: 1;
        box-shadow: 0 18px 40px -12px rgb(0 0 0 / 0.55);
        animation: slm-sp-mark 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      /* A soft brass glow behind the mark, and one ring that widens and fades. */
      #slm-splash .sp-mark::before,
      #slm-splash .sp-mark::after {
        content: "";
        position: absolute;
        inset: -22px;
        z-index: -1;
        border-radius: 12px;
        background: radial-gradient(circle, rgb(227 204 152 / 0.35), transparent 70%);
        opacity: 0;
        animation: slm-sp-glow 2.6s ease-in-out 0.6s infinite;
      }
      #slm-splash .sp-mark::after {
        inset: -8px;
        border: 1px solid rgb(227 204 152 / 0.5);
        background: none;
        border-radius: 6px;
        animation: slm-sp-ring 2.6s ease-out 1s infinite;
      }
      #slm-splash .sp-word {
        margin-top: 22px;
        font-size: 30px;
        letter-spacing: -0.01em;
        color: #f6efe0;
        animation: slm-sp-up 0.6s ease 0.35s both;
      }
      #slm-splash .sp-word i {
        color: #e3cc98;
      }
      #slm-splash .sp-tag {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        font:
          600 11px/14px "Public Sans",
          system-ui,
          sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #b7c2b5;
      }
      #slm-splash .sp-tag span {
        animation: slm-sp-up 0.5s ease both;
      }
      #slm-splash .sp-tag span:nth-child(1) {
        animation-delay: 0.55s;
      }
      #slm-splash .sp-tag span:nth-child(2) {
        animation-delay: 0.65s;
      }
      #slm-splash .sp-tag span:nth-child(3) {
        animation-delay: 0.75s;
      }
      #slm-splash .sp-tag span:nth-child(4) {
        animation-delay: 0.85s;
      }
      #slm-splash .sp-tag span:nth-child(5) {
        animation-delay: 0.95s;
      }
      #slm-splash .sp-shelf {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 64px;
        margin-top: 30px;
      }
      #slm-splash .sp-shelf b {
        display: block;
        width: var(--w);
        height: var(--h);
        border-radius: 1px 1px 0 0;
        background: var(--c);
        box-shadow: inset 2px 0 0 rgb(0 0 0 / 0.2);
        transform-origin: bottom;
        animation: slm-sp-rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both;
        animation-delay: calc(0.4s + var(--i) * 0.05s);
      }
      #slm-splash .sp-plank {
        width: 230px;
        height: 3px;
        border-radius: 1px;
        background: #0b1d16;
        box-shadow: 0 1px 0 rgb(233 225 208 / 0.08);
      }
      #slm-splash .sp-bar {
        width: 200px;
        height: 3px;
        margin-top: 26px;
        overflow: hidden;
        border-radius: 3px;
        background: rgb(233 225 208 / 0.12);
        animation: slm-sp-up 0.5s ease 0.7s both;
      }
      #slm-splash .sp-bar i {
        position: relative;
        display: block;
        width: var(--p, 6%);
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #b08433, #e3cc98);
        transition: width 0.6s cubic-bezier(0.3, 0.7, 0.3, 1);
      }
      #slm-splash .sp-bar i::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.55), transparent);
        animation: slm-sp-shine 1.2s linear infinite;
      }
      #slm-splash .sp-msg {
        min-height: 18px;
        margin-top: 12px;
        font:
          400 13px/18px "Public Sans",
          system-ui,
          sans-serif;
        color: #b7c2b5;
        animation: slm-sp-up 0.5s ease 0.9s both;
      }
      /* Plain theme: the light look, indigo accent, no shelf. */
      [data-theme="plain"] #slm-splash {
        background: radial-gradient(120% 85% at 50% 40%, #ffffff 0%, #f7f8fa 100%);
        color: #101828;
        font-family: Inter, system-ui, sans-serif;
      }
      [data-theme="plain"] #slm-splash::before,
      [data-theme="plain"] #slm-splash .sp-shelf,
      [data-theme="plain"] #slm-splash .sp-plank {
        display: none;
      }
      [data-theme="plain"] #slm-splash .sp-mark {
        border-color: #4f46e5;
        border-radius: 16px;
        background: #4f46e5;
        color: #fff;
        font:
          600 38px/1 Inter,
          system-ui,
          sans-serif;
      }
      [data-theme="plain"] #slm-splash .sp-mark::before {
        background: radial-gradient(circle, rgb(79 70 229 / 0.25), transparent 70%);
      }
      [data-theme="plain"] #slm-splash .sp-mark::after {
        border-color: rgb(79 70 229 / 0.4);
        border-radius: 22px;
      }
      [data-theme="plain"] #slm-splash .sp-word {
        font-weight: 600;
        color: #101828;
      }
      [data-theme="plain"] #slm-splash .sp-word i {
        font-style: normal;
        color: inherit;
      }
      [data-theme="plain"] #slm-splash .sp-tag,
      [data-theme="plain"] #slm-splash .sp-msg {
        color: #475467;
      }
      [data-theme="plain"] #slm-splash .sp-bar {
        background: #e4e7ec;
      }
      [data-theme="plain"] #slm-splash .sp-bar i {
        background: linear-gradient(90deg, #4f46e5, #818cf8);
      }
      @keyframes slm-sp-fade {
        from {
          opacity: 0;
        }
      }
      @keyframes slm-sp-mark {
        from {
          opacity: 0;
          transform: scale(0.86);
          filter: blur(6px);
        }
      }
      @keyframes slm-sp-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @keyframes slm-sp-rise {
        from {
          transform: scaleY(0);
        }
      }
      @keyframes slm-sp-glow {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.94);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.04);
        }
      }
      @keyframes slm-sp-ring {
        0% {
          opacity: 0.7;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.3);
        }
      }
      @keyframes slm-sp-shine {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(100%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #slm-splash,
        #slm-splash *,
        #slm-splash::before,
        #slm-splash *::before,
        #slm-splash *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="slm-splash" role="status" aria-live="polite" aria-label="Loading Smart Library">
      <div class="sp-in">
        <div class="sp-mark" aria-hidden="true">S</div>
        <div class="sp-word" aria-hidden="true">Smart <i>Library</i></div>
        <div class="sp-tag" aria-hidden="true">
          <span>Catalogue</span><span>·</span><span>Lend</span><span>·</span><span>Discover</span>
        </div>
        <div class="sp-shelf" aria-hidden="true">
          <b style="--w: 8px; --h: 48px; --c: #2f5a4c; --i: 0"></b
          ><b style="--w: 11px; --h: 58px; --c: #8b6a2c; --i: 1"></b
          ><b style="--w: 7px; --h: 45px; --c: #6a3b4f; --i: 2"></b
          ><b style="--w: 10px; --h: 63px; --c: #3a4668; --i: 3"></b
          ><b style="--w: 8px; --h: 51px; --c: #7c3f2f; --i: 4"></b
          ><b style="--w: 12px; --h: 56px; --c: #4c5a63; --i: 5"></b
          ><b style="--w: 6px; --h: 42px; --c: #2f5a4c; --i: 6"></b
          ><b style="--w: 9px; --h: 60px; --c: #a07a3a; --i: 7"></b
          ><b style="--w: 11px; --h: 48px; --c: #5a3542; --i: 8"></b
          ><b style="--w: 8px; --h: 54px; --c: #2c3a58; --i: 9"></b
          ><b style="--w: 10px; --h: 64px; --c: #6d4a22; --i: 10"></b
          ><b style="--w: 7px; --h: 46px; --c: #3f5d50; --i: 11"></b
          ><b style="--w: 12px; --h: 57px; --c: #7c3f2f; --i: 12"></b
          ><b style="--w: 8px; --h: 51px; --c: #4c5a63; --i: 13"></b>
        </div>
        <div class="sp-plank" aria-hidden="true"></div>
        <div class="sp-bar" aria-hidden="true"><i id="slm-splash-bar"></i></div>
        <div class="sp-msg" id="slm-splash-msg">Opening the reading room…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
